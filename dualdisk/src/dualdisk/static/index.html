<title>DualDisk</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@latest/css/mana.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3147;
    --text: #e2e4f0;
    --muted: #7b7f99;
    --accent: #6c63ff;
    --accent-hover: #8a83ff;
    --danger: #e05252;
    --success: #4caf82;
    --radius: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: stretch;
    gap: 24px;
  }

  .brand { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.05em; }
  .brand .subtitle { color: var(--muted); font-size: 12px; }

  .tabs { display: flex; align-items: stretch; gap: 2px; margin-left: 8px; }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 0 14px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; display: flex; flex-direction: column; padding: 20px 24px; gap: 16px; max-width: 1400px; width: 100%; margin: 0 auto; }

  .panel { display: none; flex-direction: column; gap: 16px; }
  .panel.active { display: flex; }

  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface); }

  .field.set input { width: 90px; }
  .field.type input { width: 140px; }
  .field.name input { width: 220px; }

  button {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  button.secondary:hover { background: rgba(108, 99, 255, 0.12); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 28px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-bar .count { color: var(--text); font-weight: 600; }
  .status-bar .error { color: var(--danger); }
  .status-bar .ok { color: var(--success); }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Search card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }

  .card-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    transition: border-color 0.15s, transform 0.1s;
  }

  .mana-overlay {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 3px;
    opacity: 0.55;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.9));
    pointer-events: none;
  }
  .mana-overlay .ms { font-size: 22px; }
  .card-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-tile img { width: 100%; aspect-ratio: 626/457; object-fit: cover; display: block; background: var(--bg); }
  .card-tile .card-name { padding: 5px 7px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-tile .art-placeholder { aspect-ratio: 626/457; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 28px; }

  /* Pair lands quadrant grid */
  .pair-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .artist-match {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .artist-header {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .artist-header .name { color: var(--text); font-weight: 500; }
  .artist-header .sep { color: var(--border); }

  /* grid-template-columns set inline per-match based on pair count */
  .quadrant { display: grid; }

  .quadrant-cell {
    position: relative;
    overflow: hidden;
  }
  .quadrant-cell img {
    width: 100%;
    aspect-ratio: 626/457;
    object-fit: cover;
    display: block;
    background: var(--bg);
  }
  .quadrant-cell .card-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 4px 7px;
    font-size: 10px;
    color: rgba(255,255,255,0.75);
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
  }

  .actions {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }

  .divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    max-width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    z-index: 100;
    transition: opacity 0.3s;
  }
  .toast.ok { border-color: var(--success); color: var(--success); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast a { color: inherit; }
</style>

<header>
  <div class="brand">
    <h1>DualDisk</h1>
    <span class="subtitle">CubeCobra set builder</span>
  </div>
  <nav class="tabs">
    <button class="tab active" onclick="switchTab('search', this)">Search</button>
    <button class="tab" onclick="switchTab('pair', this)">Pair Lands</button>
  </nav>
</header>

<main>

  <!-- Search tab -->
  <div class="panel active" id="panel-search">
    <div class="controls">
      <div class="field set">
        <label>Set code</label>
        <input id="set-code" placeholder="MH3" spellcheck="false">
      </div>
      <div class="field">
        <label>Rarity</label>
        <select id="rarity">
          <option value="">Any</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="mythic">Mythic</option>
        </select>
      </div>
      <div class="field type">
        <label>Type</label>
        <input id="card-type" placeholder="creature, land…">
      </div>
      <button id="search-btn" onclick="search()">Search</button>
    </div>

    <div class="status-bar" id="search-status"></div>
    <div class="card-grid" id="card-grid"></div>

    <div class="actions" id="search-actions" style="display:none">
      <div class="field name">
        <label>Name</label>
        <input id="action-name" placeholder="My Package">
      </div>
      <button onclick="createPackage()">Create Package</button>
      <div class="divider"></div>
      <button class="secondary" onclick="createCube()">Create Cube</button>
    </div>
  </div>

  <!-- Pair Lands tab -->
  <div class="panel" id="panel-pair">
    <div class="controls">
      <div class="field set">
        <label>Front set</label>
        <input id="pair-set1" placeholder="LRW" spellcheck="false">
      </div>
      <div class="field set">
        <label>Back set</label>
        <input id="pair-set2" placeholder="MH2" spellcheck="false">
      </div>
      <button id="pair-btn" onclick="pairLands()">Pair</button>
    </div>

    <div class="status-bar" id="pair-status"></div>
    <div class="pair-grid" id="pair-grid"></div>
  </div>

</main>

<script>
  const _MANA_MAP = { W: 'w', U: 'u', B: 'b', R: 'r', G: 'g' };

  function manaOverlay(colorIdentity) {
    const symbols = (colorIdentity && colorIdentity.length)
      ? colorIdentity.map(c => `<i class="ms ms-${_MANA_MAP[c]} ms-cost"></i>`).join('')
      : `<i class="ms ms-c ms-cost"></i>`;
    return `<div class="mana-overlay">${symbols}</div>`;
  }

  let _searchCards = [];

  const $ = id => document.getElementById(id);

  function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('panel-' + name).classList.add('active');
  }

  function setStatus(id, html) {
    $(id).innerHTML = html;
  }

  function showToast(msg, ok) {
    const el = document.createElement('div');
    el.className = 'toast ' + (ok ? 'ok' : 'err');
    el.innerHTML = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 5000);
  }

  // ── Search tab ──────────────────────────────────────────

  async function search() {
    const set = $('set-code').value.trim();
    if (!set) return;
    const rarity = $('rarity').value;
    const type = $('card-type').value.trim();

    const btn = $('search-btn');
    btn.disabled = true;
    $('card-grid').innerHTML = '';
    $('search-actions').style.display = 'none';
    setStatus('search-status', '<div class="spinner"></div> Fetching cards…');

    const params = new URLSearchParams({ set_code: set });
    if (rarity) params.set('rarity', rarity);
    if (type) params.set('card_type', type);

    try {
      const resp = await fetch('/api/cards?' + params);
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: resp.statusText }));
        setStatus('search-status', `<span class="error">${err.detail}</span>`);
        return;
      }
      _searchCards = await resp.json();
      renderCardGrid(_searchCards);
      const label = [rarity, type].filter(Boolean).join(', ');
      setStatus('search-status', `<span class="count">${_searchCards.length} cards</span>${label ? ' · ' + label : ''} in <strong>${set.toUpperCase()}</strong>`);
      $('action-name').value = set.toUpperCase();
      $('search-actions').style.display = _searchCards.length ? 'flex' : 'none';
    } catch (e) {
      setStatus('search-status', `<span class="error">${e.message}</span>`);
    } finally {
      btn.disabled = false;
    }
  }

  function renderCardGrid(cards) {
    const grid = $('card-grid');
    grid.innerHTML = '';
    for (const card of cards) {
      const tile = document.createElement('div');
      tile.className = 'card-tile';
      tile.title = `${card.name} · ${card.set_code}-${card.collector_number}`;
      if (card.front_art_url) {
        tile.innerHTML = `<img src="${card.front_art_url}" alt="${card.name}" loading="lazy">${manaOverlay(card.color_identity)}<div class="card-name">${card.name} <span style="opacity:.6">#${card.collector_number}</span></div>`;
      } else {
        tile.innerHTML = `<div class="art-placeholder">🃏</div><div class="card-name">${card.name} <span style="opacity:.6">#${card.collector_number}</span></div>`;
      }
      grid.appendChild(tile);
    }
  }

  async function createPackage() {
    const name = $('action-name').value.trim();
    if (!name) { showToast('Enter a package name', false); return; }
    if (_searchCards.length > 100) { showToast(`${_searchCards.length} cards exceeds the 100-card package limit`, false); return; }

    setStatus('search-status', '<div class="spinner"></div> Creating package…');
    try {
      const resp = await fetch('/api/packages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          set_code: $('set-code').value.trim(),
          name,
          rarity: $('rarity').value || null,
          card_type: $('card-type').value.trim() || null,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) { showToast(data.detail, false); setStatus('search-status', ''); return; }
      showToast(`Package created · <a href="${data.url}" target="_blank">View on CubeCobra</a>`, true);
      setStatus('search-status', `<span class="ok">Package created</span>`);
    } catch (e) {
      showToast(e.message, false);
      setStatus('search-status', '');
    }
  }

  async function createCube() {
    const name = $('action-name').value.trim() || $('set-code').value.trim().toUpperCase();
    setStatus('search-status', '<div class="spinner"></div> Creating cube…');
    try {
      const resp = await fetch('/api/cubes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          set_code: $('set-code').value.trim(),
          name,
          rarity: $('rarity').value || null,
          card_type: $('card-type').value.trim() || null,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) { showToast(data.detail, false); setStatus('search-status', ''); return; }
      showToast(`Cube created · <a href="${data.url}" target="_blank">View on CubeCobra</a>`, true);
      setStatus('search-status', `<span class="ok">Cube created</span>`);
    } catch (e) {
      showToast(e.message, false);
      setStatus('search-status', '');
    }
  }

  $('set-code').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
  $('card-type').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  // ── Pair Lands tab ───────────────────────────────────────

  const _SWAP_CARDS = new Set([
    'LRW-294', 'SHM-294', 'SHM-298', 'SHM-288', 'LRW-289', 'SHM-289', 'LRW-293',
  ]);

  function _cardKey(card) { return `${card.set_code}-${card.collector_number}`; }

  function _applySwaps(matches) {
    return matches.map(match => {
      const fronts = match.pairs.map(p => p.front);
      const backs  = match.pairs.map(p => p.back);
      const orderedFronts = fronts.some(c => _SWAP_CARDS.has(_cardKey(c))) ? [...fronts].reverse() : fronts;
      const orderedBacks  = backs.some(c  => _SWAP_CARDS.has(_cardKey(c))) ? [...backs].reverse()  : backs;
      return { ...match, pairs: orderedFronts.map((front, i) => ({ front, back: orderedBacks[i] })) };
    });
  }


  async function pairLands() {
    const set1 = $('pair-set1').value.trim();
    const set2 = $('pair-set2').value.trim();
    if (!set1 || !set2) return;

    const btn = $('pair-btn');
    btn.disabled = true;
    $('pair-grid').innerHTML = '';
    setStatus('pair-status', '<div class="spinner"></div> Fetching lands…');

    try {
      const params = new URLSearchParams({ set1, set2 });
      const resp = await fetch('/api/pair-lands?' + params);
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: resp.statusText }));
        setStatus('pair-status', `<span class="error">${err.detail}</span>`);
        return;
      }
      const matches = _applySwaps(await resp.json());
      renderPairGrid(matches);
      const pairCount = matches.reduce((n, m) => n + m.pairs.length, 0);
      setStatus('pair-status', `<span class="count">${matches.length} artist matches</span>, ${pairCount} pairs · <strong>${set1.toUpperCase()}</strong> ↔ <strong>${set2.toUpperCase()}</strong>`);
    } catch (e) {
      setStatus('pair-status', `<span class="error">${e.message}</span>`);
    } finally {
      btn.disabled = false;
    }
  }

  function artCell(card, borderRight, borderBottom) {
    const style = [
      borderRight  ? 'border-right:2px solid var(--bg)'  : '',
      borderBottom ? 'border-bottom:2px solid var(--bg)' : '',
    ].filter(Boolean).join(';');
    const img = card.front_art_url
      ? `<img src="${card.front_art_url}" alt="${card.name}" loading="lazy">`
      : `<div class="art-placeholder">🃏</div>`;
    return `<div class="quadrant-cell" style="${style}">${img}${manaOverlay(card.color_identity)}<div class="card-name">${card.name} <span style="opacity:.6">#${card.collector_number}</span></div></div>`;
  }

  function renderPairGrid(matches) {
    const grid = $('pair-grid');
    grid.innerHTML = '';
    for (const { artist1, artist2, pairs } of matches) {
      const n = pairs.length;
      const block = document.createElement('div');
      block.className = 'artist-match';

      const header = `
        <div class="artist-header">
          <span class="name">${artist1}</span>
          <span class="sep">↔</span>
          <span class="name">${artist2}</span>
        </div>`;

      // Row 1: artist1's arts (set1), Row 2: artist2's arts (set2)
      const frontRow = pairs.map(({ front }, i) => artCell(front, i < n - 1, true)).join('');
      const backRow  = pairs.map(({ back  }, i) => artCell(back,  i < n - 1, false)).join('');

      block.innerHTML = header + `<div class="quadrant" style="grid-template-columns:repeat(${n},1fr)">${frontRow}${backRow}</div>`;
      grid.appendChild(block);
    }
  }

  $('pair-set1').addEventListener('keydown', e => { if (e.key === 'Enter') pairLands(); });
  $('pair-set2').addEventListener('keydown', e => { if (e.key === 'Enter') pairLands(); });
</script>
