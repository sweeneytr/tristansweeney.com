<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; font: 13px system-ui, sans-serif; padding: 10px; }
    textarea { width: 100%; height: 140px; box-sizing: border-box; font: 12px monospace; }
    button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; }
    #status { margin-top: 8px; white-space: pre-wrap; font: 11px monospace; max-height: 160px; overflow-y: auto; }
    .hint { color: #666; font-size: 11px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="hint">One pair per line: <code>Name|FRONT_SET-NUM|BACK_SET-NUM</code><br>e.g. <code>Swamp|LRW-290|SHM-290</code></div>
  <textarea id="pairs" placeholder="Swamp|LRW-290|SHM-290"></textarea>
  <button id="run">Import into proxxied.com</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
